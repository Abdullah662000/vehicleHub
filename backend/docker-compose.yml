services:
  postgres:
    image: postgres:16-alpine
    container_name: vehiclehub-postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vehiclehub}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      POSTGRES_DB: ${DATABASE_NAME:-vehiclehub}
    volumes:
      - vehiclehub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vehiclehub_pg_data:
